name: dica

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  HTTP_BODY_LIMIT: ${HTTP_BODY_LIMIT:-10mb}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
  DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
  DB_TRANSACTION_TIMEOUT_MS: ${DB_TRANSACTION_TIMEOUT_MS:-15000}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
  DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
  DB_IDLE_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
  DEMO_POLICY_ENABLED: ${DEMO_POLICY_ENABLED:-false}

x-app-service: &app-service
  image: ${APP_IMAGE:-dica-backend:local}
  pull_policy: ${APP_PULL_POLICY:-missing}
  environment: *app-environment
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dica}
      POSTGRES_USER: ${POSTGRES_USER:-dica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    <<: *app-service
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-service
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
